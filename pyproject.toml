[project]
name = "paper-agent"
version = "0.1.0"
description = "A lightweight paper reading and literature review agent for arXiv papers."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Paper Agent Contributors" }]
dependencies = []

[project.optional-dependencies]
pdf = ["pymupdf>=1.24.0"]
dev = ["pytest>=8.0.0"]

[project.scripts]
paper-agent = "paper_agent.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
